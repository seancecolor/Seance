[package]
name = "seance-transmitter"
version = "0.2.0"
edition = "2024"
description = "Seance v2 local Linux 10-bit DeckLink -> GStreamer NVENC HEVC -> RTSP-over-TCP transmitter GUI"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
eframe = "0.31"
egui = "0.31"
gstreamer = "0.25.4"
gstreamer-video = "0.25.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
