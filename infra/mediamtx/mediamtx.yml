# MediaMTX configuration for Seance on Railway
# Non-negotiable: NO public UDP, NO SRT, NO WebRTC/WHEP, NO MoQ.
# Ingest: RTSP-over-TCP on :8554 (via Railway TCP Proxy)
# Egress: Low-Latency HLS (fMP4 10-bit HEVC + AAC) on :8888 (private internal network only)

logLevel: info
logDestinations: [stdout]

# Disable unused / UDP listeners
srt: no
webrtc: no
rtmp: no
moq: no

# Enable TCP-only RTSP ingest
rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554

# Enable Low-Latency fMP4 HLS egress (proxied privately by apps/web over mediamtx.railway.internal:8888)
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAlwaysRemux: yes
hlsAllowOrigins: ['*']

# Default auth: override in Railway via MTX_AUTHINTERNALUSERS_* env vars
authMethod: internal
authInternalUsers:
  - user: seance_ingest
    pass: change_me_in_railway
    ips: []
    permissions:
      - action: publish
        path: cleanfeed
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path: cleanfeed

paths:
  cleanfeed:
